        // 工具函数：将数字化简到个位数（数字根）
        function reduceToSingle(num) {
            let n = typeof num === 'number' ? num : parseInt(num, 10);
            if (isNaN(n)) return 0;
            while (n >= 10) {
                let s = n.toString();
                n = 0;
                for (let ch of s) {
                    n += parseInt(ch, 10);
                }
            }
            return n;
        }

        // 带0+0=5规则的加法
        function addWithZeroRule(a, b) {
            if (a === 0 && b === 0) return 5;
            return reduceToSingle(a + b);
        }

        // 获取并验证输入
        function getBirthdayDigits() {
            const yearInput = document.getElementById('birthYear');
            const monthInput = document.getElementById('birthMonth');
            const dayInput = document.getElementById('birthDay');

            let year = yearInput.value.trim();
            let month = monthInput.value.trim();
            let day = dayInput.value.trim();

            if (!year || !month || !day) {
                throw new Error('请完整填写年、月、日');
            }

            year = year.replace(/\D/g, '');
            month = month.replace(/\D/g, '');
            day = day.replace(/\D/g, '');

            if (year.length !== 4) {
                throw new Error('年份必须为4位数字（例如 2011）');
            }

            if (month.length === 1) {
                month = '0' + month;
            } else if (month.length !== 2) {
                throw new Error('月份请输入1-2位数字（例如 11 或 1）');
            }

            if (day.length === 1) {
                day = '0' + day;
            } else if (day.length !== 2) {
                throw new Error('日期请输入1-2位数字（例如 14 或 5）');
            }

            const monthNum = parseInt(month, 10);
            if (monthNum < 1 || monthNum > 12) {
                throw new Error('月份应在01-12之间');
            }

            const dayNum = parseInt(day, 10);
            if (dayNum < 1 || dayNum > 31) {
                throw new Error('日期应在01-31之间');
            }

            const birthdayStr = year + month + day;
            if (birthdayStr.length !== 8) {
                throw new Error('生日组合无效，请检查输入');
            }

            return birthdayStr.split('').map(ch => parseInt(ch, 10));
        }

        // 几号人（两两相加，直至一位数，应用0+0=5规则）
        function computePersonNumber(digits) {
            let nums = digits.slice(); // 复制数组
            while (nums.length > 1) {
                let next = [];
                for (let i = 0; i < nums.length; i += 2) {
                    if (i + 1 < nums.length) {
                        next.push(addWithZeroRule(nums[i], nums[i+1]));
                    } else {
                        next.push(nums[i]); // 奇数个时，最后一个保留
                    }
                }
                nums = next;
            }
            return nums[0];
        }

        // 内心密码：所有数字相加求数字根 → 乘以2 → 再求数字根
        function computeInnerCode(digits) {
            let sum = digits.reduce((acc, d) => acc + d, 0);
            let root = reduceToSingle(sum);
            let doubled = root * 2;
            return reduceToSingle(doubled);
        }

        // 计算中间变量 A, B, C（用于外心和潜意识）
        function computeABC(digits) {
            const d1 = digits[0], d2 = digits[1], d3 = digits[2], d4 = digits[3];
            const d5 = digits[4], d6 = digits[5];
            const d7 = digits[6], d8 = digits[7];

            const daySum = addWithZeroRule(d7, d8);
            const monthSum = addWithZeroRule(d5, d6);
            const yearFront = addWithZeroRule(d1, d2);
            const yearBack = addWithZeroRule(d3, d4);

            const A = addWithZeroRule(daySum, monthSum);
            const B = addWithZeroRule(yearFront, yearBack);
            const C = addWithZeroRule(A, B);
            return { daySum, monthSum, yearFront, yearBack, A, B, C };
        }

        // 外心密码（保留算法，但显示为无解释的数字）
        function computeOuterCode(digits) {
            const { daySum, monthSum, yearFront, yearBack, A, B, C } = computeABC(digits);
            const a1 = addWithZeroRule(A, daySum);
            const a2 = addWithZeroRule(A, monthSum);
            const Z = addWithZeroRule(a1, a2);
            const b1 = addWithZeroRule(B, yearFront);
            const b2 = addWithZeroRule(B, yearBack);
            const X = addWithZeroRule(b1, b2);
            const v1 = addWithZeroRule(A, C);
            const v2 = addWithZeroRule(B, C);
            const V = addWithZeroRule(v1, v2);
            return `${Z}${V}${X}`; // 三位数
        }

        // 潜意识密码：日期和 + 年份后两位和 + C，化简到个位数
        function computeSubconsciousCode(digits) {
            const { daySum, yearBack, C } = computeABC(digits);
            const temp = addWithZeroRule(daySum, yearBack);
            const result = addWithZeroRule(temp, C);
            return result; // 个位数
        }

        // 家庭密码：月份和 与 年份前两位和 拼接成两位数（月份和在前）
        function computeFamilyCode(digits) {
            const d1 = digits[0], d2 = digits[1], d3 = digits[2], d4 = digits[3];
            const d5 = digits[4], d6 = digits[5];
            // 月份和
            const monthSum = addWithZeroRule(d5, d6);
            // 年份前两位和
            const yearFront = addWithZeroRule(d1, d2);
            // 拼接成两位数，如果月份和或年份前两位和是0，则显示为比如05、50等
            const result = monthSum.toString() + yearFront.toString();
            return result; // 两位数（可能包含前导零，如"05"）
        }

        // 晚年密码：年份前两位的和+后两位的和 = C；前两位的和+C 与 后两位的和+C 相加
        function computeLateLifeCode(digits) {
            const d1 = digits[0], d2 = digits[1], d3 = digits[2], d4 = digits[3];
            const yearFront = addWithZeroRule(d1, d2);
            const yearBack = addWithZeroRule(d3, d4);
            const C = addWithZeroRule(yearFront, yearBack);
            const left = addWithZeroRule(yearFront, C);
            const right = addWithZeroRule(yearBack, C);
            const result = addWithZeroRule(left, right);
            return result; // 个位数
        }

        // 12组主性格（已验证多个生日，并加入0+0=5规则）
        function computeGroups(digits) {
            const d1 = digits[0], d2 = digits[1], d3 = digits[2], d4 = digits[3],
                  d5 = digits[4], d6 = digits[5], d7 = digits[6], d8 = digits[7];

            const c12 = addWithZeroRule(d1, d2);
            const c34 = addWithZeroRule(d3, d4);
            const c56 = addWithZeroRule(d5, d6);
            const c78 = addWithZeroRule(d7, d8);

            const x1 = addWithZeroRule(c56, c78);
            const x2 = addWithZeroRule(c12, c34);
            const x3 = addWithZeroRule(x1, x2);

            const e = addWithZeroRule(x1, c56);
            const f = addWithZeroRule(x1, c78);
            const g = addWithZeroRule(x2, c12);
            const h = addWithZeroRule(x2, c34);

            const p = addWithZeroRule(x1, x3);
            const q = addWithZeroRule(x2, x3);
            const r = addWithZeroRule(f, e);
            const s = addWithZeroRule(q, p);

            const groups = [
                [c56, x1, e],   // 1
                [c78, x1, f],   // 2
                [c12, x2, g],   // 3
                [c34, x2, h],   // 4
                [x2, x3, q],    // 5
                [x1, x3, p],    // 6
                [c78, c56, x1], // 7
                [f, e, r],      // 8
                [c12, c34, x2], // 9
                [x1, x2, x3],   // 10
                [q, p, s],      // 11
                [g, h, addWithZeroRule(g, h)] // 12
            ];

            return groups.map(triple => triple.join(''));
        }
